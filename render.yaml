services:
  - type: web
    name: urolog-asror-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: REPORT_BOT_TOKEN
        sync: false
      - key: REPORT_CHAT_IDS
        sync: false
      - key: ASK_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: AI_ENABLED
        value: "true"
      # Google AI Studio kaliti — Render Dashboard'da qo'lda kiritiladi
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: PYTHON_VERSION
        value: "3.11.9"
